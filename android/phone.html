<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ريموت شاشة الجامع</title>
<style>html{color-scheme:dark;font-family:system-ui}body{margin:0;padding:24px;background:#101c21;color:#eee9dc;text-align:center}main{max-width:440px;margin:auto}h1{font-size:24px}p{color:#b8c9bd;line-height:1.8}.remote{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:ltr;margin:25px 0}button{border:1px solid #75866a;background:#213e32;color:#fff;border-radius:14px;min-height:64px;font-size:21px}button:active{background:#4b7654}button:focus-visible{outline:3px solid #e1c785}textarea{box-sizing:border-box;width:100%;background:#172a2c;border:1px solid #64786b;color:white;border-radius:10px;padding:12px;font:inherit}#send{width:100%;margin-top:10px}small{color:#b4c4b9}#state{min-height:32px}</style>
<main><h1>ريموت شاشة الجامع</h1><p id="state" role="status">جارٍ التحقق من الاقتران…</p><div class="remote"><span></span><button data-key="up" aria-label="أعلى">▲</button><span></span><button data-key="left" aria-label="يسار">◀</button><button data-key="ok">OK</button><button data-key="right" aria-label="يمين">▶</button><button data-key="back">رجوع</button><button data-key="down" aria-label="أسفل">▼</button><button data-key="menu">الإعدادات</button></div><label for="text">كتابة في حقل النص المفتوح على التلفاز</label><textarea id="text" maxlength="2000" rows="3"></textarea><button id="send">إرسال النص</button><p><small>التحكم عبر الشبكة المحلية دون إنترنت. الجلسة مؤقتة لمدة 15 دقيقة؛ افتح الاقتران من التلفاز لتجديدها. يظل ريموت التلفاز يعمل.</small></p></main>
<script>'use strict';const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const state=document.getElementById('state');async function call(route,body){try{const r=await fetch(route,{method:body?'POST':'GET',headers:{'X-Mosque-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw Error();state.textContent='متصل محليًا بشاشة الجامع';return true;}catch(_){state.textContent='تعذر الاتصال. افتح اقتران الجوال من التلفاز وامسح الرمز الجديد.';return false;}}document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>call('/api/key',{key:b.dataset.key})));document.getElementById('send').addEventListener('click',()=>call('/api/text',{text:document.getElementById('text').value}));call('/api/status');</script></html>
