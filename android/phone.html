<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ريموت شاشة الجامع</title>
<style>
html{color-scheme:dark;font-family:system-ui}body{margin:0;padding:24px;background:#101c21;color:#eee9dc;text-align:center}main{max-width:440px;margin:auto}
h1{font-size:24px}p{color:#b8c9bd;line-height:1.8}.remote{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:ltr;margin:25px 0}
button{border:1px solid #75866a;background:#213e32;color:#fff;border-radius:14px;min-height:64px;font-size:21px}button:active{background:#4b7654}button:focus-visible{outline:3px solid #e1c785}button:disabled{opacity:.5}
textarea{box-sizing:border-box;width:100%;background:#172a2c;border:1px solid #64786b;color:white;border-radius:10px;padding:12px;font:inherit}#send{width:100%;margin-top:10px}small{color:#b4c4b9}#state{min-height:32px}#code{font-size:32px;letter-spacing:.15em}
</style>
<main>
  <h1>ريموت شاشة الجامع</h1>
  <p id="state" role="status">جارٍ التحقق من الاقتران…</p>
  <strong id="code" dir="ltr" hidden></strong>
  <div class="remote">
    <span></span><button data-key="up" aria-label="أعلى" disabled>▲</button><span></span>
    <button data-key="left" aria-label="يسار" disabled>◀</button><button data-key="ok" disabled>OK</button><button data-key="right" aria-label="يمين" disabled>▶</button>
    <button data-key="back" disabled>رجوع</button><button data-key="down" aria-label="أسفل" disabled>▼</button><button data-key="menu" disabled>الإعدادات</button>
  </div>
  <label for="text">كتابة في حقل النص المفتوح على التلفاز</label>
  <textarea id="text" maxlength="2000" rows="3" disabled></textarea>
  <button id="send" disabled>إرسال النص</button>
  <p><small>استخدم شبكة إدارة الجامع الخاصة. الاتصال المحلي غير مشفّر، فتجنّب كتابة أي بيانات حساسة. تنتهي الجلسة بعد 15 دقيقة.</small></p>
</main>
<script>
'use strict';
const token=location.hash.slice(1);
history.replaceState(null,'',location.pathname);
const state=document.getElementById('state'), code=document.getElementById('code');
const controls=document.querySelectorAll('button,textarea');
const expired='انتهت الجلسة أو رُفض الاقتران. افتح الاقتران من التلفاز وامسح الرمز الجديد.';
let client='', approved=false, commandSequence=0;
function setApproved(value){
  approved=value;
  controls.forEach(control=>{control.disabled=!value;});
}
function finishPairing(message){
  setApproved(false);
  code.textContent='';code.hidden=true;state.textContent=message;
}
async function request(route,body,timeout,receive){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const response=await fetch(route,{
      method:body?'POST':'GET',headers:{'X-Mosque-Token':token,'X-Mosque-Client':client,...(body?{'Content-Type':'application/json'}:{})},
      body:body?JSON.stringify(body):undefined,signal:controller.signal,redirect:'error',
      credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'
    });
    return await receive(response);
  }finally{clearTimeout(timer);}
}
async function pair(){
  const until=performance.now()+60000;
  while(performance.now()<until){
    const {status,data}=await request('/api/status',null,Math.min(5000,until-performance.now()),async response=>({
      status:response.status,data:response.ok?await response.json():null
    }));
    if(performance.now()>=until)break;
    if(status===200&&data?.connected===true){
      code.textContent='';code.hidden=true;state.textContent='متصل محليًا بشاشة الجامع';setApproved(true);return;
    }
    if(status!==202||data?.pending!==true||typeof data.code!=='string'||!/^\d{6}$/.test(data.code)){
      finishPairing(expired);return;
    }
    code.textContent=data.code;code.hidden=false;
    state.textContent='طابق هذا الرقم مع الرقم على التلفاز، ثم وافق باستخدام ريموت التلفاز.';
    await new Promise(resolve=>setTimeout(resolve,Math.min(2000,Math.max(0,until-performance.now()))));
  }
  finishPairing('انتهت مهلة الموافقة. افتح الاقتران من التلفاز وامسح الرمز الجديد.');
}
async function command(route,body){
  if(!approved)return;
  const order=++commandSequence;
  try{
    const status=await request(route,body,5000,response=>response.status);
    if(status===403){finishPairing(expired);return;}
    if(!approved||order!==commandSequence)return;
    if(status===429){state.textContent='انتظر لحظة قبل إرسال أمر آخر.';return;}
    if(status!==200)throw Error('Unconfirmed');
    state.textContent='متصل محليًا بشاشة الجامع';
  }catch(_){
    if(approved&&order===commandSequence)state.textContent='لم يتأكد وصول الأمر. تحقّق من الشاشة قبل إرساله مرة أخرى.';
  }
}
document.querySelectorAll('[data-key]').forEach(button=>button.addEventListener('click',()=>command('/api/key',{key:button.dataset.key})));
document.getElementById('send').addEventListener('click',()=>command('/api/text',{text:document.getElementById('text').value}));
try{
  if(!/^[0-9a-f]{48}$/.test(token))throw Error('Invalid QR');
  client=Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('');
  pair().catch(()=>finishPairing(expired));
}catch(_){finishPairing(expired);}
</script>
</html>
