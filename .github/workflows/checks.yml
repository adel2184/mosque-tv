name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Core and TV bridge checks
        shell: pwsh
        run: |
          node dev/build.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/check-package.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-generator.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-content.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-bridge.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-tv-settings.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOSQUE_JAVA_HOME = $env:JAVA_HOME
          node android/test-update.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-release.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-power.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
