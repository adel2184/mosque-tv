name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Audit locked reporting service packages
        working-directory: services/reports
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --input-type=module -e "import './netlify/functions/reports.mjs'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --package-lock-only --ignore-scripts --audit-level=high
      - name: Core and TV bridge checks
        shell: pwsh
        run: |
          node dev/build.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- index.html
          if ($LASTEXITCODE -ne 0) { throw "Commit the regenerated index.html." }
          node dev/check-package.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-generator.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-content.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-prayer-context.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-phone-settings.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-location-engine.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-profile-store.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-setup-wizard.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-profile-integration.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-profile-adapter.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-locale.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dev/test-setup-provider.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-bridge.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-tv-settings.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOSQUE_JAVA_HOME = $env:JAVA_HOME
          node android/test-phone-pairing.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-phone-client.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-setup-fetch.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-device-optimization.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-device-profiles.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node services/reports/test/reports.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-update.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-release.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-power.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-control-center.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-network-speed.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
