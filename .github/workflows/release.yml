name: Signed Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching manifest version, for example v2.0.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-android-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.RELEASE_SIGNING_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Require original signing secrets
        shell: pwsh
        env:
          MOSQUE_KEYSTORE_BASE64: ${{ secrets.MOSQUE_KEYSTORE_BASE64 }}
          MOSQUE_KEYSTORE_PASSWORD: ${{ secrets.MOSQUE_KEYSTORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MOSQUE_KEYSTORE_BASE64) -or [string]::IsNullOrWhiteSpace($env:MOSQUE_KEYSTORE_PASSWORD)) {
            throw 'Original signing secrets are missing. No new key will be generated. Configure the protected release-signing environment only after owner approval.'
          }
          $signingDir = Join-Path $env:GITHUB_WORKSPACE '.android-signing'
          New-Item -ItemType Directory -Force $signingDir | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $signingDir 'mosque-display.p12'), [Convert]::FromBase64String($env:MOSQUE_KEYSTORE_BASE64))
          [IO.File]::WriteAllText((Join-Path $signingDir 'password.txt'), $env:MOSQUE_KEYSTORE_PASSWORD, [Text.UTF8Encoding]::new($false))
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build using the original key and generate feed
        shell: pwsh
        run: |
          $env:MOSQUE_JAVA_HOME = $env:JAVA_HOME
          $env:MOSQUE_BUILD_TOOLS = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0'
          $env:MOSQUE_ANDROID_JAR = Join-Path $env:ANDROID_HOME 'platforms/android-35/android.jar'
          $env:MOSQUE_RELEASE = '1'
          node dev/test-content.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-bridge.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-tv-settings.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-update.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-release.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/test-power.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/build.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android/release.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish a new signed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --title $env:RELEASE_TAG --notes-file android/dist/RELEASE_NOTES_AR.txt android/dist/mosque-display-tv.apk android/dist/update.json android/dist/SHA256SUMS.txt android/INSTALL_AR.txt android/README_TV_AR.md android/TEST_REPORT_TV.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove temporary signing files
        if: always()
        shell: pwsh
        run: |
          $signingDir = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '.android-signing'))
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if ($signingDir -ne (Join-Path $workspace '.android-signing')) { throw 'Unexpected signing path' }
          if (Test-Path -LiteralPath $signingDir) { Remove-Item -LiteralPath $signingDir -Recurse -Force }
