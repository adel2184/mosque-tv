name: Signed Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Select the protected release tag as the workflow ref and repeat its name here.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-android-release
  cancel-in-progress: false
jobs:
  verify-source:
    if: >-
      startsWith(github.ref, 'refs/tags/v') && github.ref_protected &&
      ((github.event_name == 'push' && vars.RELEASE_SIGNING_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag == github.ref_name))
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release commit on the default branch
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid version tag.' }
          [xml]$manifest = Get-Content -LiteralPath 'android/AndroidManifest.xml' -Raw
          $version = $manifest.DocumentElement.GetAttribute('versionName','http://schemas.android.com/apk/res/android')
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag and manifest version differ.' }
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is outside the default branch history.' }
  checks:
    needs: verify-source
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  release:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Rebuild the reviewed web bundle
        shell: pwsh
        run: |
          node dev/build.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- index.html
          if ($LASTEXITCODE -ne 0) { throw 'Generated web bundle differs from the approved tag.' }
      - name: Sign the APK
        shell: pwsh
        env:
          MOSQUE_KEYSTORE_BASE64: ${{ secrets.MOSQUE_KEYSTORE_BASE64 }}
          MOSQUE_KEYSTORE_PASSWORD: ${{ secrets.MOSQUE_KEYSTORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MOSQUE_KEYSTORE_BASE64) -or [string]::IsNullOrWhiteSpace($env:MOSQUE_KEYSTORE_PASSWORD)) {
            throw 'Original signing credentials are required.'
          }
          $signingDir = Join-Path $env:GITHUB_WORKSPACE '.android-signing'
          if (Test-Path -LiteralPath $signingDir) { throw 'Signing directory already exists.' }
          New-Item -ItemType Directory -Path $signingDir -ErrorAction Stop | Out-Null
          $keyFile = Join-Path $signingDir 'mosque-display.p12'
          $passwordFile = Join-Path $signingDir 'password.txt'
          try {
            [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:MOSQUE_KEYSTORE_BASE64))
            [IO.File]::WriteAllText($passwordFile, $env:MOSQUE_KEYSTORE_PASSWORD, [Text.UTF8Encoding]::new($false))
            Remove-Item Env:MOSQUE_KEYSTORE_BASE64, Env:MOSQUE_KEYSTORE_PASSWORD
            $env:MOSQUE_JAVA_HOME = $env:JAVA_HOME
            $env:MOSQUE_BUILD_TOOLS = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0'
            $env:MOSQUE_ANDROID_JAR = Join-Path $env:ANDROID_HOME 'platforms/android-35/android.jar'
            $env:MOSQUE_RELEASE = '1'
            node android/build.cjs
            if ($LASTEXITCODE -ne 0) { throw 'APK signing failed.' }
          } finally {
            foreach ($file in @($passwordFile, $keyFile)) {
              if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force -ErrorAction Stop }
            }
            [IO.Directory]::Delete($signingDir)
          }
      - name: Verify the signed artifact and generate release metadata
        shell: pwsh
        run: |
          ./android/verify.ps1
          node android/release.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish a new signed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --title $env:RELEASE_TAG --notes-file android/dist/RELEASE_NOTES_AR.txt android/dist/mosque-display-tv.apk android/dist/update.json android/dist/SHA256SUMS.txt android/INSTALL_AR.txt android/README_TV_AR.md android/TEST_REPORT_TV.md docs/SETUP_AR.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
